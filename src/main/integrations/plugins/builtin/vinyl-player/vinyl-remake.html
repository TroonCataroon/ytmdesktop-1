<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remake Widget</title>
    <style>
      :root {
        /* Theme tokens (customizable) */
        --bg: rgba(12, 13, 16, 0.72);
        --bg2: rgba(20, 22, 27, 0.55);
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.95);
        --muted: rgba(255, 255, 255, 0.7);
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        --accent: #f22e76;
        --accent2: #7c3aed;
        --bar: rgba(255, 255, 255, 0.18);
        --barFill: linear-gradient(90deg, var(--accent), var(--accent2));
        --btnBg: rgba(0, 0, 0, 0.55);
        --btnBorder: rgba(255, 255, 255, 0.14);
        --btnIcon: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        background: transparent;
        font-family:
          Poppins,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          "Noto Sans",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Stable drag region; interactive elements opt-out. */
        -webkit-app-region: drag;
      }

      /* Full-bleed blurred backdrop (uses cover image when available) */
      .backdrop {
        position: absolute;
        inset: -20px;
        background:
          radial-gradient(circle at 25% 10%, rgba(242, 46, 118, 0.3), transparent 55%),
          radial-gradient(circle at 70% 60%, rgba(124, 58, 237, 0.26), transparent 55%), linear-gradient(135deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.65));
        filter: blur(18px) saturate(1.2);
        transform: scale(1.1);
        opacity: 0.95;
        pointer-events: none;
      }

      .backdrop.has-cover {
        background-size: cover;
        background-position: center;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        /* Reserve space for the bottom progress bar */
        padding: 18px 18px 44px;
      }

      /* 6K-ish layout: circle on the left, stacked panels on the right, progress bar at bottom */
      .card {
        --circleMax: 220px;
        --circleMin: 110px;
        /* Derived from window height so the circle scales with the window */
        --circleSize: clamp(var(--circleMin), calc(100vh - 90px), var(--circleMax));

        width: 100%;
        height: 100%;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, var(--bg), var(--bg2));
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        position: relative;
        overflow: hidden; /* lets the circle bleed/clip nicely like 6K */

        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 18px;
      }

      .disc-wrap {
        position: relative;
        width: var(--circleSize);
        height: var(--circleSize);
        flex: 0 0 auto;
        display: block;
        -webkit-app-region: no-drag;
        filter: drop-shadow(0 18px 50px rgba(0, 0, 0, 0.55));
      }

      /* Vinyl background layer (spins) */
      .disc {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background:
          radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.06), transparent 48%), conic-gradient(from 0deg, #0a0a0a, #161616, #0e0e0e, #262626, #0a0a0a);
        box-shadow:
          0 18px 60px rgba(0, 0, 0, 0.55),
          inset 0 0 28px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        overflow: hidden;
        transition:
          transform 180ms ease,
          filter 180ms ease;
        animation: spin 2.6s linear infinite;
      }

      .disc.paused {
        animation-play-state: paused;
        filter: grayscale(0.5) brightness(0.86);
      }

      .grooves {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background:
          repeating-radial-gradient(circle, transparent 14%, rgba(255, 255, 255, 0.035) 14.7%, transparent 15.4%),
          repeating-radial-gradient(circle, transparent 22%, rgba(255, 255, 255, 0.025) 22.5%, transparent 23%);
        opacity: 0.55;
        pointer-events: none;
      }

      /* Album art on top */
      .cover {
        position: absolute;
        inset: 14%;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
        background-size: cover;
        background-position: center;
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .cover::after {
        position: absolute;
        inset: 0;
        content: "";
        background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.18), transparent 55%);
        opacity: 0.75;
        pointer-events: none;
      }

      .hole {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 7%;
        height: 7%;
        border-radius: 50%;
        background: radial-gradient(circle, #000 0%, #1a1a1a 70%, #333 100%);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.85);
      }

      .disc-overlay {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0);
        transition: background 120ms ease;
        cursor: pointer;
      }

      .disc-overlay.disabled {
        cursor: default;
        pointer-events: none;
      }

      .disc-overlay:hover {
        background: rgba(255, 255, 255, 0.055);
      }

      .disc-overlay .icon {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        background: var(--btnBg);
        border: 1px solid var(--btnBorder);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.98);
        transition:
          opacity 120ms ease,
          transform 120ms ease;
        pointer-events: none;
      }

      .disc-overlay:hover .icon,
      .disc-overlay.active .icon {
        opacity: 1;
        transform: scale(1);
      }

      .disc-overlay svg {
        width: 22px;
        height: 22px;
        fill: var(--btnIcon);
      }

      /* Right: stacked panels (closer to 6K widget) */
      .info {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding-right: 6px;
      }

      .panel {
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(36, 44, 58, 0.65);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 14px 16px;
        min-width: 0;
      }

      .badge {
        align-self: flex-end;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(10px);
      }

      .title {
        font-size: clamp(18px, 5.3vh, 34px);
        font-weight: 800;
        line-height: 1.05;
        color: rgba(255, 120, 140, 0.95); /* 6K-ish accent */
        min-width: 0;
      }

      .artist {
        font-size: clamp(12px, 2.9vh, 18px);
        font-weight: 600;
        color: rgba(255, 255, 255, 0.72);
        min-width: 0;
      }

      .marquee {
        overflow: hidden;
        white-space: nowrap;
        min-width: 0;
      }
      .marquee > span {
        display: inline-block;
        position: relative;
      }
      .marquee.animate > span {
        animation: move 10s linear infinite;
      }

      @keyframes move {
        0%,
        25% {
          transform: translateX(0%);
          left: 0%;
        }
        75%,
        100% {
          transform: translateX(-100%);
          left: 100%;
        }
      }

      .row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .times {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.65);
      }

      .time {
        font-size: clamp(12px, 2.4vh, 16px);
        font-weight: 800;
        color: rgba(255, 130, 150, 0.95);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }

      .wave {
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        opacity: 0.95;
      }

      .wave span {
        width: 4px;
        height: 35%;
        border-radius: 999px;
        background: rgba(255, 80, 96, 0.92);
        transform-origin: center;
      }

      .wave.playing span {
        animation: wave 1.15s ease-in-out infinite;
        animation-delay: var(--d, 0ms);
      }

      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.35);
          opacity: 0.7;
        }
        45% {
          transform: scaleY(1.15);
          opacity: 1;
        }
      }

      .progressBar {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        height: 12px;
        border-radius: 999px;
        background: rgba(10, 12, 16, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }

      .progressBar > .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, rgba(255, 76, 90, 0.95), rgba(255, 76, 90, 0.55));
        border-radius: 999px;
        box-shadow: 0 0 18px rgba(255, 76, 90, 0.3);
        transition: width 220ms ease;
      }

      .controls {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 10px;
        z-index: 20;
        -webkit-app-region: no-drag;
      }

      .btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid var(--btnBorder);
        background: rgba(0, 0, 0, 0.4);
        color: var(--btnIcon);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease;
      }

      .btn:hover {
        transform: scale(1.08);
        background: rgba(0, 0, 0, 0.58);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn svg {
        width: 18px;
        height: 18px;
        fill: var(--btnIcon);
      }

      .btn.close:hover {
        background: rgba(232, 17, 35, 0.72);
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Compact widths */
      @media (max-width: 560px) {
        .card {
          gap: 12px;
          padding: 16px 16px;
        }
        .frame {
          padding: 16px 16px 42px;
        }
        .progressBar {
          left: 16px;
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" id="backdrop"></div>
    <div class="frame">
      <div class="card">
        <div class="disc-wrap">
          <div class="disc" id="disc">
            <div class="grooves"></div>
            <div class="hole"></div>
            <div class="disc-overlay" id="discOverlay">
              <div class="icon" id="overlayIcon" aria-hidden="true"></div>
            </div>
          </div>
          <div class="cover" id="cover"></div>
        </div>

        <div class="info">
          <div class="badge" id="badge">YTMDesktop</div>
          <div class="panel">
            <div class="title marquee" id="titleWrap"><span id="title">Loading…</span></div>
            <div class="artist marquee" id="artistWrap"><span id="artist">—</span></div>
          </div>
          <div class="panel row">
            <div class="time" id="tCur">0:00</div>
            <div class="wave" id="wave" aria-hidden="true">
              <span style="--d: 0ms"></span>
              <span style="--d: 80ms"></span>
              <span style="--d: 160ms"></span>
              <span style="--d: 240ms"></span>
              <span style="--d: 320ms"></span>
              <span style="--d: 400ms"></span>
              <span style="--d: 480ms"></span>
              <span style="--d: 560ms"></span>
              <span style="--d: 640ms"></span>
              <span style="--d: 720ms"></span>
              <span style="--d: 800ms"></span>
              <span style="--d: 880ms"></span>
              <span style="--d: 960ms"></span>
              <span style="--d: 1040ms"></span>
            </div>
            <div class="time" id="tDur">0:00</div>
          </div>
        </div>

        <div class="controls" id="controls">
          <button class="btn" id="btnPlayPause" title="Play/Pause" aria-label="Play/Pause"></button>
          <button class="btn close" id="btnClose" title="Close" aria-label="Close"></button>
        </div>

        <div class="progressBar" aria-hidden="true">
          <div class="fill" id="barFill"></div>
        </div>
      </div>
    </div>

    <script>
      const isElectron = Boolean(window.electron && window.electron.ipcRenderer);
      const ipc = isElectron ? window.electron.ipcRenderer : null;

      const els = {
        backdrop: document.getElementById("backdrop"),
        disc: document.getElementById("disc"),
        cover: document.getElementById("cover"),
        titleWrap: document.getElementById("titleWrap"),
        title: document.getElementById("title"),
        artistWrap: document.getElementById("artistWrap"),
        artist: document.getElementById("artist"),
        barFill: document.getElementById("barFill"),
        tCur: document.getElementById("tCur"),
        tDur: document.getElementById("tDur"),
        wave: document.getElementById("wave"),
        controls: document.getElementById("controls"),
        btnPlayPause: document.getElementById("btnPlayPause"),
        btnClose: document.getElementById("btnClose"),
        discOverlay: document.getElementById("discOverlay"),
        overlayIcon: document.getElementById("overlayIcon")
      };

      const icons = {
        play: `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>`,
        pause: `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
        close: `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L12 13.41l-6.89 6.3-1.42-1.41L10.59 12 3.69 5.71 5.1 4.29 12 10.59l6.89-6.3z"/></svg>`
      };

      if (els.btnClose) els.btnClose.innerHTML = icons.close;

      const formatTime = seconds => {
        const s = Math.max(0, Math.floor(Number(seconds || 0)));
        const mins = Math.floor(s / 60);
        const secs = String(s % 60).padStart(2, "0");
        return `${mins}:${secs}`;
      };

      const setMarquee = wrapEl => {
        if (!wrapEl) return;
        const child = wrapEl.querySelector("span");
        if (!child) return;
        // Enable marquee if content is wider than container
        requestAnimationFrame(() => {
          try {
            wrapEl.classList.toggle("animate", child.scrollWidth > wrapEl.clientWidth + 6);
          } catch {}
        });
      };

      let settings = {
        showControls: true,
        enableButtonFeature: true
      };

      let state = {
        title: "Loading…",
        artist: "—",
        thumbnail: "",
        isPlaying: false,
        spinSpeed: 2,
        durationSeconds: 0,
        progressSeconds: 0
      };

      const applySettings = s => {
        if (!s || typeof s !== "object") return;
        if (typeof s.showControls === "boolean") settings.showControls = s.showControls;
        if (typeof s.enableButtonFeature === "boolean") settings.enableButtonFeature = s.enableButtonFeature;

        if (els.controls) els.controls.style.display = settings.showControls && isElectron ? "flex" : "none";
        if (els.discOverlay) {
          els.discOverlay.classList.toggle("disabled", !settings.enableButtonFeature || !isElectron);
        }
      };

      const update = patch => {
        if (!patch || typeof patch !== "object") return;
        state = { ...state, ...patch };

        const title = String(state.title || "No track playing");
        const artist = String(state.artist || "");
        const cover = String(state.thumbnail || "");
        const isPlaying = Boolean(state.isPlaying);
        const spinSpeed = Number(state.spinSpeed || 2);
        const dur = Number(state.durationSeconds || 0);
        const prog = Number(state.progressSeconds || 0);
        const pct = dur > 0 ? Math.max(0, Math.min(1, prog / dur)) : 0;

        if (els.title) els.title.textContent = title;
        if (els.artist) els.artist.textContent = artist || "—";
        if (els.tCur) els.tCur.textContent = formatTime(prog);
        if (els.tDur) els.tDur.textContent = formatTime(dur);
        if (els.barFill) els.barFill.style.width = `${pct * 100}%`;
        if (els.wave) els.wave.classList.toggle("playing", isPlaying);

        // Cover + backdrop
        if (els.cover) {
          if (cover) {
            els.cover.style.backgroundImage = `url(${cover})`;
          }
        }
        if (els.backdrop) {
          if (cover) {
            els.backdrop.classList.add("has-cover");
            els.backdrop.style.backgroundImage = `url(${cover})`;
          } else {
            els.backdrop.classList.remove("has-cover");
            els.backdrop.style.backgroundImage = "";
          }
        }

        // Playing state affects spin + icon
        if (els.disc) els.disc.classList.toggle("paused", !isPlaying);
        if (els.disc) {
          // Match the built-in vinyl player behavior: higher spinSpeed => faster spin.
          const spinDuration = Math.max(2, 8 - spinSpeed);
          els.disc.style.animationDuration = `${spinDuration}s`;
        }
        const iconSvg = isPlaying ? icons.pause : icons.play;
        if (els.btnPlayPause) els.btnPlayPause.innerHTML = iconSvg;
        if (els.overlayIcon) els.overlayIcon.innerHTML = iconSvg;

        setMarquee(els.titleWrap);
        setMarquee(els.artistWrap);
      };

      // Electron controls
      if (isElectron) {
        els.btnPlayPause?.addEventListener("click", () => ipc.send("vinyl-player:play-pause"));
        els.btnClose?.addEventListener("click", () => ipc.send("vinyl-player:close"));

        // Multi-click actions on the disc overlay:
        // - 1 click: play/pause
        // - 2 clicks: next
        // - 3 clicks: previous
        const MULTI_CLICK_WINDOW_MS = 350;
        let clickCount = 0;
        let clickTimer = null;

        const flushClicks = () => {
          const n = clickCount;
          clickCount = 0;
          if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
          }
          if (!settings.enableButtonFeature) return;
          if (n === 1) ipc.send("vinyl-player:play-pause");
          else if (n === 2) ipc.send("vinyl-player:next");
          else if (n >= 3) ipc.send("vinyl-player:previous");
        };

        els.discOverlay?.addEventListener(
          "pointerdown",
          e => {
            if (!settings.enableButtonFeature) return;
            if (!e || e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            els.discOverlay.classList.add("active");
          },
          true
        );
        const clearActive = () => els.discOverlay?.classList.remove("active");
        els.discOverlay?.addEventListener("pointerup", clearActive, true);
        els.discOverlay?.addEventListener("pointercancel", clearActive, true);
        els.discOverlay?.addEventListener("pointerleave", clearActive, true);

        els.discOverlay?.addEventListener(
          "click",
          e => {
            if (!settings.enableButtonFeature) return;
            e.preventDefault();
            e.stopPropagation();
            clickCount += 1;
            if (clickTimer) clearTimeout(clickTimer);
            clickTimer = setTimeout(flushClicks, MULTI_CLICK_WINDOW_MS);
          },
          true
        );

        ipc.on("vinyl-player:update-track", track => update(track));
        ipc.on("vinyl-player:update-settings", s => applySettings(s));
      } else {
        // Standalone overlay: poll the local companion server /query endpoint
        applySettings({ showControls: false, enableButtonFeature: false });
        const poll = async () => {
          try {
            const res = await fetch("/query", { cache: "no-store" });
            const json = await res.json();
            const mapped = {
              title: json?.track?.title || "No track playing",
              artist: json?.track?.author || "",
              thumbnail: json?.track?.cover || "",
              isPlaying: !json?.player?.isPaused,
              durationSeconds: Number(json?.track?.duration || 0),
              progressSeconds: Number(json?.player?.seekbarCurrentPosition || 0)
            };
            update(mapped);
          } catch {
            // ignore
          }
        };
        poll();
        setInterval(poll, 900);
      }

      // Init
      update(state);
      applySettings(settings);
    </script>
  </body>
</html>
