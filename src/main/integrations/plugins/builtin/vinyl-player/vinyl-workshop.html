<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Isometric Workshop Player</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #171811;
        --line: #29291d;
        --cream: #ded2ae;
        --dim: #a99e7c;
        --olive: #596044;
        --od: #353b2c;
        --ol: #78805a;
        --wood: #795238;
        --wd: #432f24;
        --wl: #a1734b;
        --brass: #b39659;
        --rust: #a24e35;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14150f;
        color: var(--cream);
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      button,
      input {
        font: inherit;
      }
      button,
      [role="slider"] {
        -webkit-app-region: no-drag;
      }
      button:focus-visible,
      [role="slider"]:focus-visible {
        outline: 4px solid #e5cc75;
        outline-offset: 5px;
      }
      #scene {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%);
        transform-origin: center;
        overflow: hidden;
        background: #25281d;
      }
      .room {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(30deg, transparent 49.6%, #ded2ae12 50%, transparent 50.4%) 0 0/96px 56px,
          linear-gradient(150deg, transparent 49.6%, #ded2ae0d 50%, transparent 50.4%) 0 0/96px 56px,
          linear-gradient(#303426 0 58%, #24251b 58%);
      }
      .room:before {
        content: "";
        position: absolute;
        inset: 57% 0 auto;
        height: 22px;
        background: linear-gradient(#15160f 0 5px, #6c4a32 5px 16px, #33251c 16px);
        border-block: 2px solid var(--line);
      }
      .window {
        position: absolute;
        left: 150px;
        top: 94px;
        width: 450px;
        height: 340px;
        background: linear-gradient(155deg, #343b45, #161c22 68%);
        border: 24px solid var(--wd);
        box-shadow:
          0 0 0 5px var(--line),
          inset 0 0 0 5px #9a704c;
      }
      .window:before,
      .window:after {
        content: "";
        position: absolute;
        background: var(--wd);
      }
      .window:before {
        width: 16px;
        height: 100%;
        left: 50%;
      }
      .window:after {
        height: 16px;
        width: 100%;
        top: 58%;
      }
      .moon {
        position: absolute;
        left: 335px;
        top: 140px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #d7c889;
        box-shadow: 18px -8px 0 #252b34;
      }
      .peg {
        position: absolute;
        right: 120px;
        top: 88px;
        width: 420px;
        height: 360px;
        border: 12px solid var(--wd);
        box-shadow: 0 0 0 4px var(--line);
        background:
          radial-gradient(circle, #161811 0 4px, transparent 5px) 0 0/34px 34px,
          #5f563d;
      }
      .tool {
        position: absolute;
        width: 22px;
        border: 4px solid var(--line);
        background: var(--ol);
        transform-origin: 50% 0;
      }
      .t1 {
        height: 190px;
        left: 100px;
        top: 65px;
        transform: rotate(8deg);
      }
      .t2 {
        height: 140px;
        left: 210px;
        top: 88px;
        background: var(--rust);
        transform: rotate(-13deg);
      }
      .t3 {
        height: 175px;
        right: 70px;
        top: 55px;
        background: var(--brass);
        transform: rotate(4deg);
      }
      .bench {
        position: absolute;
        left: -100px;
        right: -100px;
        bottom: -65px;
        height: 500px;
        background:
          linear-gradient(90deg, transparent 0 8%, #1d140f55 8.4% 9%, transparent 9.4% 28%, #1d140f40 28.5% 29.2%, transparent 29.6%),
          linear-gradient(#8a6142, #67472f 62%, #432e22);
        border-top: 8px solid var(--line);
        box-shadow: inset 0 15px #a77850;
      }
      .machine {
        --machine-scale: 1;
        position: absolute;
        left: 970px;
        top: 590px;
        width: 780px;
        height: 520px;
        transform: translate(-50%, -50%) scale(var(--machine-scale));
        transform-origin: center;
      }
      .shadow {
        position: absolute;
        left: 80px;
        top: 355px;
        width: 660px;
        height: 130px;
        border-radius: 50%;
        background: #0f0d0a85;
        filter: blur(10px);
      }
      .deck {
        position: absolute;
        left: 85px;
        top: 20px;
        width: 610px;
        height: 430px;
        transform: rotateX(58deg) rotateZ(-38deg);
        transform-style: preserve-3d;
      }
      .deck-top {
        position: absolute;
        inset: 0;
        border: 9px solid var(--line);
        border-radius: 18px;
        background:
          linear-gradient(90deg, transparent 49%, #2318122e 50%, transparent 51%) 0 0/64px 100%,
          linear-gradient(160deg, var(--wl), var(--wood) 45%, #60412f);
        box-shadow:
          inset 0 0 0 9px #a8784c,
          18px 24px 0 var(--wd),
          23px 30px 0 var(--line);
      }
      .deck-top:after {
        content: "";
        position: absolute;
        inset: 20px;
        border: 4px solid #29291d80;
        border-radius: 10px;
      }
      .platter {
        position: absolute;
        width: 350px;
        height: 350px;
        left: 54px;
        top: 38px;
        border-radius: 50%;
        background: repeating-radial-gradient(circle, #1a1b18 0 8px, #292b27 9px 12px);
        border: 12px solid var(--line);
        box-shadow:
          0 0 0 9px #777568,
          10px 13px 0 #19140fbf;
      }
      .disc {
        position: absolute;
        inset: 13px;
        border-radius: 50%;
        animation: spin 4s linear infinite;
      }
      .disc.paused {
        animation-play-state: paused;
      }
      .disc:before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: repeating-radial-gradient(circle, #171815 0 7px, #292a25 8px 10px);
        border: 5px solid #090a08;
      }
      .label {
        position: absolute;
        inset: 31%;
        border-radius: 50%;
        overflow: hidden;
        background: var(--rust);
        border: 5px solid var(--dim);
      }
      .art {
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, var(--rust), #552b22);
        background-size: cover;
        background-position: center;
      }
      .hole {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: var(--ink);
        border: 3px solid var(--brass);
      }
      .arm {
        position: absolute;
        right: 36px;
        top: 37px;
        width: 155px;
        height: 330px;
        transform-origin: 50% 36px;
        transform: rotate(-9deg);
        transition: transform 0.35s ease;
        cursor: grab;
        z-index: 4;
      }
      .pivot {
        position: absolute;
        left: 47px;
        top: 0;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--brass) 0 18%, #71633e 19% 48%, var(--line) 49%);
        border: 5px solid var(--line);
      }
      .bar {
        position: absolute;
        left: 75px;
        top: 48px;
        width: 24px;
        height: 245px;
        border-radius: 14px;
        background: linear-gradient(90deg, #675e4c, #d3c596 45%, #615845 70%);
        border: 4px solid var(--line);
      }
      .head {
        position: absolute;
        left: 62px;
        bottom: 2px;
        width: 55px;
        height: 82px;
        border: 5px solid var(--line);
        border-radius: 6px 6px 16px 16px;
        background: var(--od);
      }
      .lamp {
        position: absolute;
        left: 732px;
        top: 194px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #4a4939;
        border: 5px solid var(--line);
      }
      .machine.playing .lamp {
        background: #d3a342;
        box-shadow: 0 0 22px #daaa42b3;
      }
      .panel {
        position: absolute;
        left: 1240px;
        top: 725px;
        width: 455px;
        min-height: 240px;
        padding: 28px 32px;
        background: var(--od);
        border: 6px solid var(--line);
        box-shadow:
          12px 14px 0 #1c1e17,
          inset 0 0 0 5px var(--ol);
        transform: skewY(-3deg);
        -webkit-app-region: no-drag;
      }
      .panel > * {
        transform: skewY(3deg);
      }
      .title {
        color: #f0dfad;
        font:
          700 30px/1.15 Georgia,
          serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .artist {
        color: var(--dim);
        font-size: 20px;
        margin: 9px 0 22px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress {
        height: 26px;
        padding: 5px;
        border: 4px solid var(--line);
        background: #1b1c16;
        cursor: pointer;
      }
      .fill {
        height: 100%;
        width: 0;
        background: var(--rust);
        box-shadow: inset 0 0 0 2px #d87950;
      }
      .times {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--dim);
        font: 700 16px/1 monospace;
      }
      .transport {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 19px;
      }
      .control {
        min-height: 48px;
        border: 4px solid var(--line);
        background: var(--dim);
        color: var(--ink);
        font-size: 21px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: inset 0 -7px #432f2440;
      }
      .control:hover {
        background: var(--cream);
      }
      .control:active {
        transform: translateY(3px);
      }
      .control.playing {
        background: var(--rust);
        color: #f7e4bd;
      }
      .volume {
        position: absolute;
        left: 300px;
        top: 780px;
        width: 390px;
        padding: 20px 25px;
        background: #34372b;
        border: 5px solid var(--line);
        box-shadow: 10px 11px #181a14;
        -webkit-app-region: no-drag;
      }
      .volume label {
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .volume input {
        width: 100%;
        margin-top: 14px;
        accent-color: var(--rust);
        cursor: pointer;
      }
      .close {
        position: absolute;
        right: 35px;
        top: 35px;
        width: 56px;
        height: 56px;
        font-size: 26px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="scene" aria-label="Isometric record player workshop">
      <div class="room">
        <div class="window"></div>
        <div class="moon"></div>
        <div class="peg"><i class="tool t1"></i><i class="tool t2"></i><i class="tool t3"></i></div>
        <div class="bench"></div>
      </div>
      <section class="machine" id="machine" aria-label="Record player">
        <div class="shadow"></div>
        <div class="deck">
          <div class="deck-top">
            <div class="platter">
              <div class="disc paused" id="vinylDisc">
                <div class="label"><div class="art" id="albumArt"></div></div>
                <div class="hole"></div>
              </div>
            </div>
            <div class="arm" id="tonearm" role="slider" tabindex="0" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="armPivot" aria-hidden="true" style="position: absolute; width: 0; height: 0; pointer-events: none"></span>
              <div class="pivot"></div>
              <div class="bar"></div>
              <div class="head"></div>
            </div>
          </div>
        </div>
        <div class="lamp"></div>
      </section>
      <section class="panel" id="infoPanel" aria-live="polite">
        <div class="title" id="trackTitle">Workshop Player</div>
        <div class="artist" id="trackArtist">Ready for YouTube Music</div>
        <div class="progress" id="progressBar" role="slider" tabindex="0" aria-label="Track position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill" id="progressFill"></div>
        </div>
        <div class="times"><span id="currTime">0:00</span><span id="totalTime">0:00</span></div>
        <div class="transport">
          <button class="control" id="previousBtn" aria-label="Previous track">◀◀</button
          ><button class="control" id="playPauseBtn" aria-label="Play">▶</button><button class="control" id="nextBtn" aria-label="Next track">▶▶</button>
        </div>
      </section>
      <div class="volume">
        <label for="volumeRange"><span>VOLUME</span><output id="volumeValue">100%</output></label
        ><input id="volumeRange" type="range" min="0" max="100" value="100" />
      </div>
      <button class="control close" id="closeBtn" aria-label="Close player">×</button>
    </main>
    <script>
      const isElectron = Boolean(window.electron && window.electron.ipcRenderer),
        ipcRenderer = isElectron ? window.electron.ipcRenderer : { send: () => {}, on: () => {} };
      const ids = [
          "scene",
          "machine",
          "vinylDisc",
          "albumArt",
          "tonearm",
          "armPivot",
          "trackTitle",
          "trackArtist",
          "progressBar",
          "progressFill",
          "currTime",
          "totalTime",
          "infoPanel",
          "previousBtn",
          "playPauseBtn",
          "nextBtn",
          "volumeRange",
          "volumeValue",
          "closeBtn"
        ],
        els = Object.fromEntries(ids.map(id => [id, document.getElementById(id)])),
        CFG = { w: 1920, h: 1080, rest: -9, start: 5, end: 31 };
      let duration = 0,
        progress = 0,
        playing = false,
        dragging = false,
        dragStartAngle = 0,
        dragArmAngle = 0,
        track = {};
      function layout() {
        const s = Math.min(innerWidth / CFG.w, innerHeight / CFG.h);
        els.scene.style.transform = `translate(-50%,-50%) scale(${s})`;
      }
      function time(v) {
        v = Number.isFinite(+v) ? Math.max(0, +v) : 0;
        return `${Math.floor(v / 60)}:${Math.floor(v % 60)
          .toString()
          .padStart(2, "0")}`;
      }
      function arm(p) {
        p = Math.min(1, Math.max(0, p));
        els.tonearm.style.transform = `rotate(${CFG.start + p * (CFG.end - CFG.start)}deg)`;
        els.tonearm.setAttribute("aria-valuenow", String(Math.round(p * 100)));
      }
      function seek(p) {
        p = Math.min(1, Math.max(0, p));
        ipcRenderer.send("vinyl-player:seek", p * duration);
        arm(p);
      }
      function pointerAngle(e) {
        const pivot = els.armPivot.getBoundingClientRect();
        const matrix = new DOMMatrix(getComputedStyle(els.tonearm.closest(".deck")).transform);
        // ponytail: affine deck and uniform ancestor scales; use perspective unprojection if the artwork gains perspective.
        const point = new DOMMatrix([matrix.a, matrix.b, matrix.c, matrix.d, 0, 0])
          .inverse()
          .transformPoint({ x: e.clientX - pivot.x, y: e.clientY - pivot.y });
        return Number.isFinite(point.x) && Number.isFinite(point.y) && (point.x || point.y) ? Math.atan2(-point.x, point.y) * (180 / Math.PI) : null;
      }
      function update(patch) {
        if (!patch || typeof patch !== "object") return;
        track = { ...track, ...patch };
        const t = track;
        els.trackTitle.textContent = t.title ?? "Unknown Title";
        els.trackArtist.textContent = t.artist ?? "Unknown Artist";
        els.albumArt.style.backgroundImage = t.thumbnail ? `url("${String(t.thumbnail).replace(/["\\]/g, "\\$&")}")` : "";
        playing = !!t.isPlaying;
        els.vinylDisc.classList.toggle("paused", !playing);
        els.machine.classList.toggle("playing", playing);
        els.playPauseBtn.classList.toggle("playing", playing);
        els.playPauseBtn.textContent = playing ? "Ⅱ" : "▶";
        els.playPauseBtn.ariaLabel = playing ? "Pause" : "Play";
        els.vinylDisc.style.animationDuration = `${Math.max(1.2, 5.8 - (+t.spinSpeed || 1))}s`;
        duration = Math.max(0, +t.durationSeconds || 0);
        progress = Math.min(duration, Math.max(0, +t.progressSeconds || 0));
        const p = duration ? progress / duration : 0;
        els.progressFill.style.width = `${p * 100}%`;
        els.progressBar.setAttribute("aria-valuenow", String(Math.round(p * 100)));
        els.currTime.textContent = time(progress);
        els.totalTime.textContent = time(duration);
        if (typeof patch.volume === "number" && Number.isFinite(patch.volume)) {
          const volume = Math.min(100, Math.max(0, patch.volume));
          els.volumeRange.value = String(volume);
          els.volumeValue.value = `${volume}%`;
        }
        if (!dragging) els.tonearm.style.transform = `rotate(${playing || progress ? CFG.start + p * (CFG.end - CFG.start) : CFG.rest}deg)`;
      }
      ipcRenderer.on("vinyl-player:update-track", update);
      ipcRenderer.on("vinyl-player:update-settings", s => {
        if (s.showControls !== undefined) {
          const d = s.showControls ? "" : "none";
          els.infoPanel.style.display = d;
          els.closeBtn.style.display = d;
        }
        if (s.scale !== undefined) els.machine.style.setProperty("--machine-scale", String(Math.min(1.35, Math.max(0.7, +s.scale || 1))));
      });
      els.playPauseBtn.onclick = () => ipcRenderer.send("vinyl-player:play-pause");
      els.previousBtn.onclick = () => ipcRenderer.send("vinyl-player:previous");
      els.nextBtn.onclick = () => ipcRenderer.send("vinyl-player:next");
      els.closeBtn.onclick = () => ipcRenderer.send("vinyl-player:close");
      els.volumeRange.oninput = e => {
        const v = +e.target.value;
        els.volumeValue.value = `${v}%`;
        ipcRenderer.send("vinyl-player:set-volume", v);
      };
      els.progressBar.onpointerdown = e => {
        const r = els.progressBar.getBoundingClientRect();
        seek((e.clientX - r.left) / r.width);
      };
      els.tonearm.onpointerdown = e => {
        const style = getComputedStyle(els.tonearm);
        const [x, y] = style.transformOrigin.split(" ");
        els.armPivot.style.left = x;
        els.armPivot.style.top = y;
        const rotation = new DOMMatrix(style.transform);
        dragArmAngle = Math.atan2(rotation.b, rotation.a) * (180 / Math.PI);
        const angle = pointerAngle(e);
        if (angle === null || !Number.isFinite(dragArmAngle)) return;
        dragStartAngle = angle;
        dragging = true;
        els.tonearm.style.transition = "none";
        els.tonearm.setPointerCapture(e.pointerId);
        e.preventDefault();
      };
      els.tonearm.onpointermove = e => {
        if (dragging) {
          const angle = pointerAngle(e);
          if (angle === null) return;
          const delta = ((angle - dragStartAngle + 540) % 360) - 180;
          arm((dragArmAngle + delta - CFG.start) / (CFG.end - CFG.start));
        }
      };
      els.tonearm.onpointerup = e => {
        if (dragging) {
          dragging = false;
          els.tonearm.style.transition = "";
          els.tonearm.releasePointerCapture(e.pointerId);
          seek(+els.tonearm.getAttribute("aria-valuenow") / 100);
        }
      };
      els.tonearm.onpointercancel = els.tonearm.onlostpointercapture = () => {
        dragging = false;
        els.tonearm.style.transition = "";
      };
      addEventListener("keydown", e => {
        if (e.target === els.volumeRange) return;
        if (e.code === "Space") {
          e.preventDefault();
          ipcRenderer.send("vinyl-player:play-pause");
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (duration) seek((progress - 5) / duration);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          if (duration) seek((progress + 5) / duration);
        } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          els.volumeRange.value = String(Math.min(100, Math.max(0, +els.volumeRange.value + (e.key === "ArrowUp" ? 5 : -5))));
          els.volumeRange.dispatchEvent(new Event("input", { bubbles: true }));
        } else if (e.key === "Escape") ipcRenderer.send("vinyl-player:close");
      });
      addEventListener("resize", layout);
      layout();
      if (!isElectron)
        update({ title: "Workshop Player", artist: "Ready for YouTube Music", isPlaying: false, spinSpeed: 2, durationSeconds: 242, progressSeconds: 74 });
    </script>
  </body>
</html>
