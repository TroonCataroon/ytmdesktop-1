---
name: Application Build

on:
  - push
  - pull_request

jobs:
  build:
    strategy:
      matrix:
        os: [
            { name: 'linux',   image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' },
            { name: 'macos',   image: 'macos-latest' }
          ]
        arch: [ 'x64', 'arm64' ]
        exclude:
          # Mitigation for Electron Forge naming conflict. See #1183 / publish.yml.
          - os:
              name: 'windows'
              image: 'windows-latest'
            arch: 'arm64'
      fail-fast: false
          

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Corepack Enable Yarn
        run: corepack enable yarn

      - name: Setup Node (v22)
        uses: actions/setup-node@v4
        with:
          # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
          cache: 'yarn'
          node-version: "22.20.0"

      - name: Install dependencies
        run: yarn --immutable

      - name: Build (${{ matrix.arch }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER || github.repository_owner }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY || github.event.repository.name }}
        run: yarn make --arch ${{ matrix.arch }}

      - name: Verify packaged runtime assets
        if: matrix.os.name == 'windows'
        run: yarn verify:package

      - name: Verify make artifact names
        env:
          VERIFY_MAKE_ARCH: ${{ matrix.arch }}
        run: yarn verify:make

      - name: Upload artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os.name }}-${{ matrix.arch }}
          path: |
            out/make/squirrel.windows/${{ matrix.arch }}/*.exe
            out/make/squirrel.windows/${{ matrix.arch }}/RELEASES
            out/make/squirrel.windows/${{ matrix.arch }}/*.nupkg
            out/make/deb/${{ matrix.arch }}/*.deb
            out/make/rpm/${{ matrix.arch }}/*.rpm
            out/make/zip/darwin/${{ matrix.arch }}/*.zip
