---
name: Application Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Forge discovers draft releases by tag. Serializing prevents parallel
      # jobs from creating sibling drafts before the first draft is visible.
      max-parallel: 1
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        arch: [ 'x64', 'arm64' ]
        exclude:
          # Mitigation for Electron Forge naming conflict. See #1183.
          - os: 'windows-latest'
            arch: 'arm64'

      fail-fast: true # Explicitly failing fast because this is a publish. We want to bail the entire release if something went wrong with another build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Corepack Enable Yarn
        run: corepack enable yarn

      - name: Setup Node (v22)
        uses: actions/setup-node@v4
        with:
          # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
          cache: 'yarn'
          node-version: "22.20.0"

      - name: Install dependencies
        run: yarn --immutable

      - name: Publish Dry (${{ matrix.arch }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER || github.repository_owner }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY || github.event.repository.name }}
        run: yarn publish:dry --arch ${{ matrix.arch }}

      - name: Publish From Dry (${{ matrix.arch }})
        run: yarn publish:fromdry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER || github.repository_owner }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY || github.event.repository.name }}

  finalize-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes "Cross-platform desktop release built and verified by GitHub Actions."
          --draft=false
